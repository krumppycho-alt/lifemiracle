<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wish Tree Canopy View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f2b90d",
              "background-light": "#f8f8f5",
              "background-dark": "#221e10",
              "wood-dark": "#3e2710",
              "wood-light": "#8b5e34",
              "paper-light": "#f4ecd8",
              "paper-dark": "#e6dec5",
            },
            fontFamily: {
              "display": ["Newsreader", "serif"],
              "body": ["Noto Sans", "sans-serif"],
            },
            backgroundImage: {
              'wood-pattern': "url('https://www.transparenttextures.com/patterns/wood-pattern.png')",
              'paper-texture': "url('https://www.transparenttextures.com/patterns/cream-paper.png')",
              'star-pattern': "radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px)",
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            animation: {
                'float': 'float 6s ease-in-out infinite',
                'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                }
            }
          },
        },
      }
    </script>
<style>
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(84, 78, 59, 0.2); 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #8b5e34; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #5e4024; 
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(242, 185, 13, 0.5), 0 0 20px rgba(242, 185, 13, 0.3);
        }
        .paper-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(62, 39, 16, 0.1);
        }
    </style>
</head>
<body class="bg-[#120f0a] font-display text-slate-100 min-h-screen flex flex-col relative overflow-x-hidden selection:bg-primary selection:text-[#181611]">
<div class="fixed inset-0 z-0 w-full h-full bg-[#0a0805]">
<div class="absolute inset-0 bg-star-pattern bg-[length:550px_550px] opacity-20 animate-pulse-slow"></div>
<div class="absolute inset-0 bg-gradient-to-t from-[#2a2215] via-[#120f0a] to-[#050403] opacity-90"></div>
<div class="absolute -top-20 inset-x-0 h-[120%] bg-cover bg-top opacity-70 mix-blend-screen" data-alt="Close up of golden tree branches glowing in the night sky" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAnAPlF-8fxV1hDSo9aR8e0Se_UTWKDXU4aJYqL2-3WT8ghgfWKMx6tIdqRM5mZbNUwvVHc4rue2C8FRcVgcR0Zxlj3366h8QHuxLmnyicmfMolcKKgrKQs9j8Of5cIo1xbSxrGKcXntVtCqnsTCCZpK8K_hTvdDegUWjgs4uFN1jvDZORcnlsOrNUUc0e-g3mUawtlkqaEatgv0BAexIo9O7rt4bCb47gIRiTJ0fjb3DFkAzUxUXxmsVAbUSXtShLSY6HxNyYr6EmJ');">
</div>
<div class="absolute top-1/4 left-1/4 w-2 h-2 bg-primary rounded-full shadow-[0_0_15px_4px_rgba(242,185,13,0.6)] animate-float" style="animation-delay: 0s;"></div>
<div class="absolute top-1/3 right-1/4 w-3 h-3 bg-primary rounded-full shadow-[0_0_20px_5px_rgba(242,185,13,0.5)] animate-float" style="animation-delay: 1.5s;"></div>
<div class="absolute top-10 left-1/2 w-2 h-2 bg-primary rounded-full shadow-[0_0_10px_3px_rgba(242,185,13,0.7)] animate-float" style="animation-delay: 2.2s;"></div>
<div class="absolute bottom-1/3 right-10 w-1.5 h-1.5 bg-primary rounded-full shadow-[0_0_12px_4px_rgba(242,185,13,0.4)] animate-float" style="animation-delay: 0.8s;"></div>
</div>
<div class="relative z-10 flex flex-col min-h-screen w-full items-center justify-center p-4">
<div class="absolute top-8 text-center opacity-80 animate-float">
<h2 class="text-primary text-xl tracking-[0.2em] font-light uppercase glow-text">The Wishing Canopy</h2>
</div>
<main class="w-full max-w-lg mt-12 mb-20">
<div class="w-full flex justify-center -mb-2 relative z-0">
<div class="w-1 h-16 bg-[#5e4024] opacity-80"></div>
</div>
<div class="relative bg-paper-light text-[#3e2710] rounded-sm paper-shadow transform rotate-1 transition-transform hover:rotate-0 duration-500">
<div class="absolute inset-0 bg-paper-texture opacity-50 pointer-events-none mix-blend-multiply rounded-sm"></div>
<div class="absolute top-0 left-0 w-16 h-16 border-t-4 border-l-4 border-[#d4c5a3] rounded-tl-sm opacity-50"></div>
<div class="absolute bottom-0 right-0 w-16 h-16 border-b-4 border-r-4 border-[#d4c5a3] rounded-br-sm opacity-50"></div>
<div class="relative p-8 md:p-10 flex flex-col gap-6">
<div class="text-center">
<h1 class="font-display text-3xl font-bold text-[#5e4024] mb-2">Make a Wish</h1>
<p class="font-body text-sm text-[#8b5e34] italic">"Whisper your heart to the leaves above."</p>
</div>
<div class="space-y-4">
<div class="relative group">
<textarea class="w-full bg-[#fffdf5] border-2 border-[#d4c5a3] rounded-none p-5 text-[#3e2710] placeholder-[#b8a07e] focus:border-[#8b5e34] focus:ring-0 resize-none min-h-[200px] font-display text-xl leading-relaxed shadow-inner transition-colors" placeholder="I wish for..."></textarea>
<span class="absolute bottom-4 right-4 material-symbols-outlined text-[#d4c5a3] text-2xl group-focus-within:text-[#8b5e34] transition-colors">edit</span>
</div>
<div class="flex items-center justify-between text-sm text-[#5e4024] font-body">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="rounded border-[#8b5e34] text-[#8b5e34] focus:ring-[#8b5e34]/50 bg-[#fffdf5]" type="checkbox"/>
<span>Make wish anonymous</span>
</label>
<span class="opacity-60">0/500</span>
</div>
</div>
<div class="flex justify-center mt-2">
<button class="relative group">
<div class="absolute inset-0 bg-[#8b1010] rounded-full blur-md opacity-20 group-hover:opacity-40 transition-opacity"></div>
<div class="relative bg-[#a31616] text-[#ffdddd] border-2 border-[#ffdddd]/30 w-32 h-32 rounded-full flex flex-col items-center justify-center shadow-lg transform group-hover:scale-105 transition-all rotate-[-12deg] group-hover:rotate-0">
<span class="material-symbols-outlined text-3xl mb-1">auto_awesome</span>
<span class="font-display font-bold text-lg uppercase tracking-widest">Seal</span>
<span class="text-[10px] uppercase opacity-80">With Hope</span>
</div>
</button>
</div>
</div>
<div class="absolute -bottom-3 left-0 right-0 h-4 bg-paper-light" style="mask-image: radial-gradient(circle at 10px, transparent 10px, black 11px); mask-size: 20px 20px; mask-position: bottom; -webkit-mask-image: radial-gradient(circle, transparent 6px, black 7px); -webkit-mask-size: 20px 20px; -webkit-mask-position: bottom;"></div>
</div>
</main>
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center group cursor-pointer pb-4">
<div class="h-16 w-[2px] bg-[#1a1205] relative top-1"></div>
<div class="relative">
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full group-hover:bg-primary/40 transition-all duration-700"></div>
<div class="relative bg-[#2a1d0f] border-4 border-[#3e2710] rounded-xl p-1 shadow-2xl transform transition-transform group-hover:translate-y-1">
<div class="bg-[#fcf5d2] border border-[#8b5e34] px-6 py-3 rounded-lg flex items-center gap-3 shadow-[inset_0_0_20px_rgba(242,185,13,0.5)]">
<span class="material-symbols-outlined text-[#3e2710] text-2xl group-hover:animate-bounce">arrow_downward</span>
<div class="flex flex-col items-start">
<span class="text-[#3e2710] font-display font-bold text-lg leading-none uppercase tracking-wide">Return</span>
<span class="text-[#5e4024] text-xs font-body font-medium uppercase tracking-widest">To Shop Entrance</span>
</div>
</div>
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-8 h-4 bg-[#1a1205] rounded-t-lg"></div>
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-3 bg-[#1a1205] rounded-b-lg shadow-md"></div>
</div>
</div>
</div>
</div>

</body></html>
