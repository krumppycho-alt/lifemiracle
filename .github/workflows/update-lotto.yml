name: Update Lotto Data Weekly

on:
  schedule:
    # 매주 토요일 KST 기준 21:00 (UTC 12:00)
    - cron: "0 12 * * 6"
  workflow_dispatch: # 수동 실행을 위한 트리거

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Run lotto update script
        run: node update_lotto.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add lotto_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update lotto data (Saturday)" && git push)
