<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인생 잡화점 - 로또 번호 추천</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <meta
      name="description"
      content="인생 잡화점에서 당신의 행운의 로또 번호를 추첨해보세요. 프리미엄 로또 번호 생성기."
    />
  </head>
  <body>
    <!-- 가게 입장 인트로 오버레이 -->
    <div id="intro-overlay">
        <div class="intro-content">
            <span class="material-symbols-outlined intro-icon">storefront</span>
            <div class="intro-title">인생 잡화점</div>
            <div class="intro-subtitle">OPEN UNTIL DAWN</div>
            <button id="intro-btn" class="glow-on-hover intro-btn">입 장 하 기</button>
        </div>
    </div>
    <!-- 고정 UI: 상단 방문자수 통계 -->
    <div class="top-stats-container">
        <span class="stats-label">Tonight's Visitors</span>
        <div class="flip-clock" id="visitor-flip-clock">
            <!-- JS dynamic -->
        </div>
    </div>

    <!-- 📻 앰비언스 라디오 -->
    <div class="ambience-radio active" id="bgm-toggle" title="음악 재생/정지">
        <span class="material-symbols-outlined radio-icon playing" id="bgm-icon">radio</span>
        <div class="radio-status">BGM ON</div>
    </div>
    <audio id="bgm-player" loop autoplay>
        <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <!-- 좌측 사이드 책갈피 -->
    <div class="left-bookmarks-container">
        <aside class="left-bookmark miracle-bookmark">
            <div class="bookmark-content">
                <h3 class="bookmark-title">명당 현황</h3>
                <div id="miracle-list" class="miracle-list">
                    <div class="loading-message">소식 대기 중...</div>
                </div>
            </div>
        </aside>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdaZDvX9WCN2bQ4ox4hWtNCRyj_0MZEaj2ylXSfp9zaf2gxVw/viewform?usp=header" target="_blank" class="left-bookmark form-bookmark">
            <div class="bookmark-content">
                <h3 class="bookmark-title">당첨 소식 전하기</h3>
            </div>
        </a>
    </div>

    <!-- 공통 간판 (드래그/클릭 핸들 역할) -->
    <div class="signboard-wrapper">
        <div class="signboard-ornate glow-on-hover pointer-cursor" id="main-signboard-trigger">
            <!-- 좌우 태슬 장식 -->
            <div class="tassel-container left"><div class="knot"></div><div class="threads"></div></div>
            <div class="tassel-container right"><div class="knot"></div><div class="threads"></div></div>
            <div class="signboard-glow"></div>
            <div class="ornate-frame">
                <h1>인생잡화점</h1>
                <p>소소한 재미와 놀라운 기적을 만나는 명당 (클릭하여 이동)</p>
            </div>
        </div>
        <div class="signboard-ornate glow-on-hover pointer-cursor tree-variant" id="tree-signboard-trigger">
            <!-- 좌우 태슬 장식 (소원나무용 색상 반전/옥색) -->
            <div class="tassel-container left tree-tassel"><div class="knot"></div><div class="threads"></div></div>
            <div class="tassel-container right tree-tassel"><div class="knot"></div><div class="threads"></div></div>
            <div class="signboard-glow tree-glow"></div>
            <div class="ornate-frame tree-frame">
                <h1>소원나무</h1>
                <p>당신의 간절한 소망을 매달아보세요 (클릭하여 귀환)</p>
            </div>
        </div>
    </div>

    <!-- 수직 뷰포트 & 슬라이더 -->
    <div class="full-viewport">
        <div class="full-slider" id="full-slider">
            
            <!-- 페이지 1: 샵 내부 (Lotto) -->
            <section class="screen-page shop-page" id="page-lotto">
                <div class="content-container">
                    <div class="vintage-machine">
                        <div class="machine-glass" id="machine-glass">
                            <div class="mini-ball color-red"></div>
                            <div class="mini-ball color-yellow"></div>
                            <div class="mini-ball color-blue"></div>
                            <div class="mini-ball color-green"></div>
                            <div class="mini-ball color-gray"></div>
                        </div>
                        <div class="machine-base">
                            <div class="machine-hole"></div>
                        </div>
                    </div>

                    <div class="options-panel">
                        <div class="option-group">
                            <label for="game-count">게임 수:</label>
                            <select id="game-count" class="styled-select">
                                <option value="1">1게임</option><option value="2">2게임</option><option value="3">3게임</option><option value="4">4게임</option><option value="5" selected>5게임</option><option value="6">6게임</option><option value="7">7게임</option><option value="8">8게임</option><option value="9">9게임</option><option value="10">10게임</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label class="checkbox-container">
                                <input type="checkbox" id="include-bonus">
                                <span class="checkmark"></span>
                                보너스 번호 포함 (7개 추출)
                            </label>
                        </div>
                    </div>

                    <div class="lotto-machine" id="lotto-machine">
                        <div class="balls-container" id="game-0">
                            <div class="placeholder">버튼을 눌러 번호를 추첨해주세요</div>
                        </div>
                    </div>

                    <button id="generate-btn" class="glow-on-hover">
                        행운 번호 추첨하기
                    </button>
                </div> <!-- /content-container -->
            </section>

            <!-- 페이지 2: 뒷마당 기적의 소원 나무 -->
            <section class="screen-page backyard-page" id="page-tree">
                <div class="tree-hitbox" id="tree-hitbox">
                    <!-- Javascript가 100개의 지정 좌표에 쪽지를 생성함 -->
                </div>
                
                <div class="wish-form-wrapper">
                    <textarea id="wish-input" class="wish-text-area" placeholder="소망을 적어주세요..." maxlength="100"></textarea>
                    <button id="wish-submit-btn" class="wish-btn-vintage glow-on-hover">소원 나무패 달기</button>
                </div>
            </section>

        </div>
    </div>

    <!-- 외부 스크립트 로드 -->
    <script src="lotto_data.js"></script>
    <script src="baseStats.js"></script>
    <script src="script.js"></script>
  </body>
</html>
